<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кто из троих?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section id="start-screen">
      <h1>Кто из троих?</h1>
      <p id="pool-status"></p>

      <fieldset>
        <legend>Режим лейблов</legend>
        <label>
          <input type="radio" name="mode" value="preset" checked />
          Пресет
        </label>
        <select id="preset-select"></select>

        <label>
          <input type="radio" name="mode" value="custom" />
          Свои лейблы
        </label>
        <div id="custom-inputs">
          <input type="text" id="custom-label-0" placeholder="Лейбл 1" />
          <input type="text" id="custom-label-1" placeholder="Лейбл 2" />
          <input type="text" id="custom-label-2" placeholder="Лейбл 3" />
        </div>

        <label>
          <input type="radio" name="mode" value="none" />
          Без лейблов
        </label>
      </fieldset>

      <button id="start-button">Начать</button>
      <p id="start-error" class="error" hidden></p>
    </section>

    <section id="round-screen" hidden>
      <div id="chip-row"></div>
      <div id="cards-row"></div>
      <button id="next-button">Следующая тройка</button>
      <button id="change-mode-button">Сменить режим</button>
    </section>

    <p id="fatal-error" class="error" hidden></p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
