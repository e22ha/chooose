name: Build photo manifest

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate manifest.json
        run: node scripts/build-manifest.js
      - name: Commit manifest.json if changed
        run: |
          if [ -n "$(git status --porcelain manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: regenerate manifest.json"
            git push
          else
            echo "manifest.json unchanged"
          fi
